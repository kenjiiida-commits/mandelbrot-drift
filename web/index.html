<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>マンデルブロ・ドリフト</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;
    font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:#eee;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none}
  .ui{transition:opacity .6s ease}
  .hidden{opacity:0;pointer-events:none}
  #info{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:16px;right:16px;
    font-size:13px;letter-spacing:.03em;text-shadow:0 1px 4px #000;line-height:1.5;pointer-events:none}
  #info b{font-size:17px;font-weight:600;display:block}
  #q{display:block;font-size:12px;color:#bbb}
  #bar{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-wrap:wrap;justify-content:center;gap:5px;
    padding:6px;border-radius:24px;width:max-content;background:rgba(20,20,24,.6);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);max-width:calc(100vw - 20px)}
  button{border:0;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;
    font-size:13px;padding:9px 12px;white-space:nowrap;font-family:inherit;cursor:pointer}
  button:active{background:rgba(255,255,255,.25)}
  #menu{position:fixed;left:0;right:0;bottom:0;max-height:78vh;overflow-y:auto;
    background:rgba(20,20,24,.94);border-radius:18px 18px 0 0;padding:8px 0 calc(env(safe-area-inset-bottom) + 10px);
    transform:translateY(105%);transition:transform .3s ease;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  #menu.open{transform:none}
  #menu .row{display:flex;align-items:center;justify-content:space-between;width:100%;box-sizing:border-box;
    padding:14px 20px;border-radius:0;background:none;font-size:15px;text-align:left}
  #menu .row:active{background:rgba(255,255,255,.08)}
  #menu .sub{font-size:12px;color:#aaa;display:block;margin-top:2px}
  #menu hr{border:0;border-top:1px solid rgba(255,255,255,.12);margin:4px 0}
  .sw{width:44px;height:26px;border-radius:13px;background:#555;position:relative;flex:none;transition:background .2s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
  .sw.on{background:#4c8dff}.sw.on::after{left:21px}
  #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:15px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="cv" style="display:none"></canvas>
<div id="fade"></div>
<div id="info" class="ui"><b id="place">—</b><span id="detail"></span><span id="q"></span></div>
<div id="bar" class="ui">
  <button id="bMenu">模様</button>
  <button id="bColor">色</button>
  <button id="bSpeed">速さ 1×</button>
  <button id="bPlay">一時停止</button>
  <button id="bHold" style="display:none">ずっと見る</button>
  <button id="bFull">全画面</button>
</div>
<div id="menu"></div>
<div id="msg"></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const glc = $('gl'), cv = $('cv'), ctx = cv.getContext('2d');
const gl = glc.getContext('webgl2', {antialias:false, alpha:false, powerPreference:'high-performance'});
function fail(t){ $('msg').style.display='flex'; $('msg').textContent=t; }
if (!gl) { fail('この端末（またはブラウザ）ではWebGL2が使えないため描画できません。'); return; }

// ───────── GPUで描く部分 ─────────
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;

const FS = `#version 300 es
precision highp float;
precision highp int;
uniform vec2 uRes, uCenter, uJ;
uniform float uScale, uRot, uShift, uIter, uMode, uTime, uVar;
uniform vec3 uA, uB, uC, uD;
uniform highp sampler2D uRef;   // マンデルブロ集合の「基準の点」の軌道（倍精度で計算した結果）
uniform int uRefLen;
uniform int uAA;                // 1画素を何×何回に分けて計算するか
out vec4 outColor;

vec3 pal(float t) { return uA + uB * cos(6.2831853 * (uC * t + uD)); }
vec2 cmul(vec2 a, vec2 b) { return vec2(a.x*b.x - a.y*b.y, a.x*b.y + a.y*b.x); }
vec2 cdiv(vec2 a, vec2 b) { return vec2(a.x*b.x + a.y*b.y, a.y*b.x - a.x*b.y) / dot(b, b); }
float hash(float n) { return fract(sin(n * 127.1 + 3.7) * 43758.5453); }
vec3 colorN(float n) { return pal(sqrt(n) * 0.32 + uShift) * (0.75 + 0.25 * smoothstep(0.0, 6.0, n)); }
vec2 refAt(int m) { return texelFetch(uRef, ivec2(m & 1023, m >> 10), 0).xy; }

// マンデルブロ集合：基準の点との「差」だけを計算する摂動法で、1兆倍近くまで潜る
vec3 mandel(vec2 dc) {
  if (uScale > 1e-3) {
    vec2 c = uCenter + dc;
    float xq = c.x - 0.25, q = xq*xq + c.y*c.y;
    if (q*(q + xq) < 0.25*c.y*c.y || (c.x+1.0)*(c.x+1.0) + c.y*c.y < 0.0625) return vec3(0.0);
  }
  vec2 dz = vec2(0.0);
  int m = 0;
  int maxI = int(uIter);
  for (int i = 0; i < maxI; i++) {
    vec2 Z = refAt(m);
    dz = cmul(2.0*Z + dz, dz) + dc;
    m++;
    vec2 z = refAt(m) + dz;
    float r2 = dot(z, z);
    if (r2 > 256.0) return colorN(float(i) + 1.0 - log2(0.5 * log2(r2)));
    if (r2 < dot(dz, dz) || m >= uRefLen - 1) { dz = z; m = 0; }
  }
  return vec3(0.0);
}

vec3 julia(vec2 z) {
  float trap = 1e9;
  int maxI = int(uIter);
  for (int i = 0; i < maxI; i++) {
    z = vec2(z.x*z.x - z.y*z.y, 2.0*z.x*z.y) + uJ;
    float m = dot(z, z);
    trap = min(trap, abs(z.x*z.y));
    if (m > 256.0) return colorN(float(i) + 1.0 - log2(0.5 * log2(m)));
  }
  return pal(sqrt(trap)*1.4 + uShift + 0.5) * 0.18;
}

vec3 newton(vec2 z) {
  vec2 a = vec2(1.0 + 0.45*sin(uTime*0.11), 0.35*sin(uTime*0.07));
  vec2 r1 = vec2(1.0, 0.0), r2 = vec2(-0.5, 0.8660254), r3 = vec2(-0.5, -0.8660254);
  float mPrev = 1.0;
  for (int i = 0; i < 80; i++) {
    vec2 z2 = cmul(z, z);
    vec2 f = cmul(z2, z) - vec2(1.0, 0.0);
    vec2 fp = 3.0 * z2;
    if (dot(fp, fp) < 1e-10) break;
    z -= cmul(a, cdiv(f, fp));
    float d1 = dot(z-r1, z-r1), d2 = dot(z-r2, z-r2), d3 = dot(z-r3, z-r3);
    float m = min(d1, min(d2, d3));
    if (m < 1e-6) {
      float root = (m == d1) ? 0.0 : ((m == d2) ? 1.0 : 2.0);
      float it = float(i) + clamp((log(1e-6) - log(mPrev)) / (log(m) - log(mPrev)), 0.0, 1.0);
      return pal(root/3.0 + it*0.045 + uShift) * (0.3 + 0.7*exp(-it*0.07));
    }
    mPrev = m;
  }
  return vec3(0.02);
}

vec3 waves(vec2 p) {
  float s = 0.0;
  for (int i = 0; i < 3; i++) {
    float fi = float(i);
    float ang = fi*2.0944 + uTime*0.04*(1.0 + 0.4*fi);
    float rad = 0.35 + 0.2*sin(uTime*0.06 + fi*1.7);
    s += cos(length(p - vec2(cos(ang), sin(ang))*rad) * 70.0 - uTime*2.0);
  }
  float bright = s*s/9.0;
  return pal(0.45*bright + uShift + 0.3*length(p)) * (0.05 + 0.95*sqrt(bright));
}

vec3 voronoi(vec2 p) {
  float ax = max(uRes.x/uRes.y, 1.0);
  float d1 = 1e9, d2 = 1e9, id = 0.0;
  for (int i = 0; i < 40; i++) {
    float fi = float(i);
    vec2 b = vec2(hash(fi)*2.0 - 1.0, hash(fi + 31.7)*2.0 - 1.0) * vec2(ax*1.15, 1.15);
    vec2 sp = b + 0.2*vec2(sin(uTime*(0.15 + 0.3*hash(fi+3.0)) + fi), cos(uTime*(0.15 + 0.3*hash(fi+7.0)) + fi*1.3));
    float d = length(p - sp);
    if (d < d1) { d2 = d1; d1 = d; id = fi; } else if (d < d2) { d2 = d; }
  }
  vec3 col = pal(hash(id + 11.0)*0.8 + uShift) * (0.6 + 0.5*(1.0 - smoothstep(0.0, 0.45, d1)));
  return mix(vec3(0.02), col, smoothstep(0.010, 0.020, d2 - d1));
}

// ═══════ 万華鏡 10種類 ═══════
// uJ.x = 鏡で分ける数（双曲の鏡では多角形の角の数）、uJ.y = 明るさ、uVar = 種類（0〜17）

vec2 kfold(vec2 p, float n) {
  float r = length(p);
  float a = atan(p.y, p.x);
  float seg = 6.2831853 / n;
  a = mod(a, seg);
  a = abs(a - 0.5 * seg);
  return r * vec2(cos(a), sin(a));
}

vec2 rot2(vec2 p, float a) {
  float c = cos(a);
  float s = sin(a);
  return vec2(c * p.x - s * p.y, s * p.x + c * p.y);
}

vec2 hash2(vec2 p) {
  p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
  return fract(sin(p) * 43758.5453);
}

float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash2(i).x;
  float b = hash2(i + vec2(1.0, 0.0)).x;
  float c = hash2(i + vec2(0.0, 1.0)).x;
  float d = hash2(i + vec2(1.0, 1.0)).x;
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

float fbm(vec2 p) {
  float s = 0.0;
  float w = 0.5;
  for (int i = 0; i < 4; i++) {
    s += w * vnoise(p);
    p = rot2(p, 0.6) * 2.03 + vec2(1.7, 9.2);
    w *= 0.5;
  }
  return s;
}

// 緑と青の宝石の色（エメラルド・サファイア・アクアマリン）
vec3 gemColor(float h) {
  if (h < 0.42) return vec3(0.02, 0.62, 0.30);
  if (h < 0.84) return vec3(0.06, 0.22, 0.85);
  return vec3(0.10, 0.70, 0.80);
}

// 緑と青の宝石らしい色の流れ（深い青→エメラルド→アクア→金のきらめき）
vec3 jewel(float t) {
  t = fract(t);
  vec3 navy = vec3(0.01, 0.03, 0.14);
  vec3 sapphire = vec3(0.05, 0.25, 0.85);
  vec3 emerald = vec3(0.02, 0.62, 0.32);
  vec3 aqua = vec3(0.35, 0.9, 0.9);
  if (t < 0.25) return mix(navy, sapphire, t / 0.25);
  if (t < 0.5) return mix(sapphire, emerald, (t - 0.25) / 0.25);
  if (t < 0.75) return mix(emerald, aqua, (t - 0.5) / 0.25);
  return mix(aqua, navy, (t - 0.75) / 0.25);
}

// 0. 宝石のレース：折り返しと反転を繰り返す
vec3 k0Lace(vec2 p) {
  vec2 z = kfold(p, uJ.x);
  z = z * (1.2 + 0.25 * sin(uTime * 0.05)) + vec2(0.15 * sin(uTime * 0.03), 0.0);
  vec2 k = vec2(0.82 + 0.12 * sin(uTime * 0.071), 0.55 + 0.12 * cos(uTime * 0.053));
  float tr = 1e9;
  float tl = 1e9;
  for (int i = 0; i < 9; i++) {
    z = abs(z) / max(dot(z, z), 1e-4) - k;
    float m = length(z);
    tr = min(tr, abs(m - 0.5));
    tl = min(tl, abs(z.y));
  }
  return pal(tl * 1.5 + tr + uShift) * (1.0 - smoothstep(0.0, 0.35, tr)) * 1.1
       + pal(tl * 3.0 + uShift + 0.5) * exp(-tl * 12.0) * 0.6;
}

// 1. エメラルドとサファイア：多面カットの宝石を金の枠に散りばめる
vec3 k1Gems(vec2 p) {
  vec2 q = kfold(p, uJ.x);
  q = rot2(q, uTime * 0.04) * 4.5 + vec2(uTime * 0.12, uTime * 0.05);
  vec2 g = floor(q);
  vec2 f = fract(q);
  float d1 = 9.0;
  float d2 = 9.0;
  vec2 cid = vec2(0.0);
  vec2 cv = vec2(0.0);
  for (int j = -1; j <= 1; j++) {
    for (int i = -1; i <= 1; i++) {
      vec2 o = vec2(float(i), float(j));
      vec2 h = hash2(g + o);
      vec2 r = o + 0.5 + 0.3 * sin(uTime * 0.25 + 6.2831 * h) - f;
      float d = dot(r, r);
      if (d < d1) { d2 = d1; d1 = d; cid = g + o; cv = r; }
      else if (d < d2) { d2 = d; }
    }
  }
  d1 = sqrt(d1);
  d2 = sqrt(d2);
  vec2 h = hash2(cid + 7.0);
  vec3 base = gemColor(h.x);
  float fa = atan(cv.y, cv.x);
  float facet = floor((fa + 3.1416) / 0.7854);
  float shade = 0.45 + 0.55 * hash(facet + h.y * 17.0);
  float table = 1.0 - smoothstep(0.12, 0.18, d1);
  float spark = pow(max(0.0, cos(fa - uTime * 0.8 - h.y * 6.28)), 20.0) * (1.0 - smoothstep(0.0, 0.45, d1));
  vec3 col = base * (shade * (1.0 - table) + 1.35 * table) * (0.6 + 0.8 * (1.0 - smoothstep(0.0, 0.5, d1)));
  col += vec3(0.85, 1.0, 1.0) * spark * 1.4;
  float edge = smoothstep(0.03, 0.09, d2 - d1);
  return mix(vec3(0.55, 0.42, 0.15) * (0.5 + 0.5 * sin(uTime + d1 * 20.0)), col, edge);
}

// 2. 星屑：青と緑のきらめきが流れる
vec3 k2Stars(vec2 p) {
  vec2 q = kfold(p, uJ.x);
  float neb = fbm(q * 2.5 + vec2(uTime * 0.04, 0.0));
  vec3 col = vec3(0.0, 0.015, 0.04) + mix(vec3(0.0, 0.12, 0.10), vec3(0.02, 0.06, 0.22), neb) * neb * 1.6;
  for (int l = 0; l < 4; l++) {
    float fl = float(l);
    float sc = 3.0 + fl * 2.5;
    vec2 z = rot2(q, uTime * 0.02 * (fl + 1.0)) * sc + vec2(0.0, uTime * 0.25 * (fl + 1.0));
    vec2 g = floor(z);
    vec2 f = fract(z) - 0.5;
    vec2 h = hash2(g + fl * 13.0);
    vec2 r = f - (h - 0.5) * 0.7;
    float d = length(r);
    float tw = 0.4 + 0.6 * sin(uTime * 2.5 + h.x * 40.0);
    float glow = exp(-d * d * 60.0) * 1.6 + 0.02 / (d + 0.03);
    float flare = exp(-abs(r.x) * 50.0) * exp(-abs(r.y) * 6.0) + exp(-abs(r.y) * 50.0) * exp(-abs(r.x) * 6.0);
    vec3 c = h.y < 0.5 ? vec3(0.2, 1.0, 0.55) : vec3(0.3, 0.55, 1.0);
    col += c * (glow + flare * 0.7) * tw * (h.x > 0.2 ? 1.0 : 0.0) / (1.0 + 0.5 * fl);
  }
  return col;
}

// 3. 無限トンネル：どこまでも奥へ続く鏡
// mode 0=基本 1=らせん 2=宝石の回廊 3=光の輪 4=二つの渦
vec3 k3Tunnel(vec2 p, float mode) {
  vec2 w = p;
  float fadeR = 0.0;
  if (mode > 3.5) {
    // 2つの点を両端にする変換で、一方の渦から湧いてもう一方へ吸い込まれる
    vec2 A = rot2(vec2(0.55, 0.0), uTime * 0.06);
    w = cdiv(p - A, p + A);
    fadeR = min(length(p - A), length(p + A)) * 2.5;
  }
  float r = length(w) + 1e-4;
  float ang = atan(w.y, w.x);
  float depth = log(r) * (mode > 3.5 ? 0.9 : 1.4);
  vec2 lp = vec2(depth - uTime * 0.35, ang * uJ.x / 6.2831853);
  if (mode > 0.5 && mode < 1.5) lp.y += depth * 1.2;
  if (mode < 3.5) fadeR = r;
  vec2 c = abs(fract(lp) - 0.5) * 2.0;
  vec2 z = c * 1.3;
  vec2 k = vec2(0.75 + 0.1 * sin(uTime * 0.09), 0.6 + 0.1 * cos(uTime * 0.07));
  float tr = 1e9;
  float tl = 1e9;
  for (int i = 0; i < 6; i++) {
    z = abs(z) / max(dot(z, z), 1e-4) - k;
    tr = min(tr, abs(length(z) - 0.45));
    tl = min(tl, abs(z.y));
  }
  float ring = floor(lp.x);
  vec3 col;
  if (mode > 0.5 && mode < 1.5) {
    col = pal(tr * 1.0 + ring * 0.07 + mod(floor(lp.y), uJ.x) * 0.05 + uShift) * exp(-tr * 8.0)
        + vec3(1.0, 0.95, 0.9) * exp(-tr * 60.0) * 0.4;
  } else if (mode > 1.5 && mode < 2.5) {
    col = jewel(tr * 1.5 + ring * 0.13 + uShift * 0.3) * exp(-tr * 6.0) * 1.3
        + vec3(0.8, 1.0, 1.0) * exp(-tr * 80.0) * 0.8;
  } else if (mode > 2.5 && mode < 3.5) {
    col = pal(ring * 0.1 + uShift) * (0.03 / (tl + 0.015)) * 0.9
        + pal(ring * 0.1 + uShift + 0.5) * (0.02 / (tr + 0.01)) * 0.8;
  } else {
    col = pal(tr * 1.2 + ring * 0.11 + uShift) * exp(-tr * 9.0) * 0.9
        + vec3(1.0, 0.95, 0.85) * exp(-tr * 60.0) * 0.5;
  }
  return col * smoothstep(0.0, 0.35, fadeR);
}

// 4. 双曲の鏡：円の縁へ向かって無限に細かくなる敷き詰め（ポアンカレ円板）
vec3 k4Hyper(vec2 p) {
  vec2 z = p * 1.02;
  float rr = dot(z, z);
  float hd = log((1.0 + sqrt(rr)) / max(1.0 - sqrt(rr), 1e-4));
  if (rr >= 1.0) return vec3(0.0, 0.02, 0.04) + vec3(0.1, 0.3, 0.5) * exp(-(sqrt(rr) - 1.0) * 30.0);
  // 円板の中をゆっくり流す（双曲平面の平行移動）
  vec2 c = 0.35 * vec2(cos(uTime * 0.1), sin(uTime * 0.13));
  z = cdiv(z + c, vec2(1.0, 0.0) + cmul(vec2(c.x, -c.y), z));
  float P = uJ.x;
  float A = 3.14159265 / P;
  float B = 3.14159265 / 3.0;
  float den = sqrt(cos(B) * cos(B) - sin(A) * sin(A));
  float cd = cos(B) / den;
  float cr = sin(A) / den;
  vec2 n = vec2(-sin(A), cos(A));
  float flips = 0.0;
  for (int i = 0; i < 40; i++) {
    bool moved = false;
    if (z.y < 0.0) { z.y = -z.y; flips += 1.0; moved = true; }
    float t = dot(z, n);
    if (t > 0.0) { z -= 2.0 * t * n; flips += 1.0; moved = true; }
    vec2 w = z - vec2(cd, 0.0);
    float l2 = dot(w, w);
    if (l2 < cr * cr) { z = vec2(cd, 0.0) + w * (cr * cr / l2); flips += 1.0; moved = true; }
    if (!moved) break;
  }
  float e1 = z.y;
  float e2 = abs(dot(z, n));
  float e3 = length(z - vec2(cd, 0.0)) - cr;
  float e = min(e1, min(e2, e3));
  float par = mod(flips, 2.0);
  vec3 col = pal(par * 0.35 + hd * 0.12 + length(z) * 0.6 + uShift) * (0.45 + 0.55 * par);
  col = mix(vec3(1.0, 0.97, 0.85), col, smoothstep(0.0, 0.01 + 0.01 * (1.0 - rr), e));
  return col * (0.3 + 0.7 * (1.0 - rr));
}

// 5. アポロニウスのレース：円の中に円が無限に詰まる
vec3 k5Apollo(vec2 p) {
  vec2 z = kfold(p, uJ.x) * 3.2 + vec2(0.3 * sin(uTime * 0.07), 0.2 * cos(uTime * 0.05));
  float s = 1.15 + 0.12 * sin(uTime * 0.11);
  float scale = 1.0;
  float orb = 1e4;
  for (int i = 0; i < 8; i++) {
    z = -1.0 + 2.0 * fract(0.5 * z + 0.5);
    float r2 = max(dot(z, z), 1e-5);
    orb = min(orb, r2);
    float k = s / r2;
    z *= k;
    scale *= k;
  }
  float d = 0.25 * abs(z.y) / scale;
  vec3 col = pal(sqrt(orb) * 1.3 + uShift) * (0.35 + 0.65 * sqrt(orb));
  col = mix(vec3(0.85, 0.95, 1.0), col, smoothstep(0.0, 0.006, d));
  return col;
}

// 6. 流れるガラス：溶けたガラスのように色が流れる
// mode 0=宝石色 1=夕焼け 2=オーロラ 3=大理石 4=オパール
vec3 sunset(float t) {
  t = fract(t);
  vec3 c0 = vec3(0.12, 0.02, 0.18);
  vec3 c1 = vec3(0.75, 0.15, 0.35);
  vec3 c2 = vec3(1.0, 0.55, 0.15);
  vec3 c3 = vec3(1.0, 0.88, 0.5);
  if (t < 0.25) return mix(c0, c1, t / 0.25);
  if (t < 0.5) return mix(c1, c2, (t - 0.25) / 0.25);
  if (t < 0.75) return mix(c2, c3, (t - 0.5) / 0.25);
  return mix(c3, c0, (t - 0.75) / 0.25);
}

vec3 k6Liquid(vec2 p, float mode) {
  vec2 q = kfold(p, uJ.x) * 2.2;
  float t = uTime * 0.12;
  vec2 a = vec2(fbm(q + vec2(0.0, t)), fbm(q + vec2(5.2, 1.3 - t)));
  vec2 b = vec2(fbm(q + 3.5 * a + vec2(1.7, 9.2) + t), fbm(q + 3.5 * a + vec2(8.3, 2.8) - t));
  float v = fbm(q + 3.0 * b);
  vec3 col;
  if (mode < 0.5) {
    col = jewel(v * 1.8 + length(b) * 0.4 + uShift * 0.3) * (0.4 + 1.4 * v);
    col += vec3(0.95, 0.85, 0.45) * pow(max(0.0, v - 0.6), 2.0) * 5.0;
  } else if (mode < 1.5) {
    col = sunset(v * 1.6 + length(b) * 0.4 + uShift * 0.3) * (0.35 + 1.5 * v);
    col += vec3(1.0, 0.9, 0.6) * pow(max(0.0, v - 0.62), 2.0) * 6.0;
  } else if (mode < 2.5) {
    float curtain = pow(abs(sin(q.y * 1.3 + 7.0 * v + t * 3.0)), 3.0);
    float sky = 0.5 + 0.5 * sin(length(q) * 0.8 - t);
    col = vec3(0.0, 0.02, 0.06) + vec3(0.02, 0.03, 0.1) * sky;
    col += mix(vec3(0.1, 1.0, 0.45), vec3(0.6, 0.25, 1.0), clamp(b.x * 1.6 - 0.3, 0.0, 1.0)) * curtain * (0.5 + 2.2 * v * v);
  } else if (mode < 3.5) {
    float vein = abs(sin(q.x * 3.0 + q.y * 1.7 + 12.0 * v));
    float cloud = fbm(q * 3.0 + b * 2.0);
    col = mix(vec3(0.95, 0.96, 0.98), vec3(0.62, 0.68, 0.8), cloud * cloud);
    col = mix(vec3(0.04, 0.14, 0.5), col, smoothstep(0.0, 0.25, vein));
    col = mix(vec3(0.95, 0.75, 0.3), col, smoothstep(0.0, 0.04, abs(vein - 0.6)));
  } else {
    vec3 iri = 0.6 + 0.4 * cos(6.2831853 * (v * 2.5 + length(b) * 1.2 + vec3(0.0, 0.33, 0.67) + uShift));
    col = iri * (0.55 + 0.6 * v) + vec3(1.0) * pow(max(0.0, v - 0.55), 2.0) * 3.0;
  }
  return col;
}

// 7. 光の糸：鏡と鏡の間を、光る糸が波打ちながら行き交う
vec3 k7Threads(vec2 p) {
  vec2 q = kfold(p, uJ.x);
  float half_ = 3.14159265 / uJ.x;
  float rad = length(q);
  float u = atan(q.y, q.x) / half_;          // 鏡の扇形の中での位置（0〜1）
  float span = rad * half_;                  // 扇形のその場所での幅
  vec3 col = vec3(0.0, 0.0, 0.02);
  for (int i = 0; i < 7; i++) {
    float fi = float(i);
    float target = 0.5 + 0.45 * sin(rad * (5.0 + fi * 1.7) - uTime * (0.5 + 0.12 * fi) + fi * 1.9);
    float d = abs(u - target) * span;
    col += pal(fi * 0.13 + rad * 0.3 + uShift) * (0.006 / (d + 0.004));
  }
  return col * 0.5 * smoothstep(0.0, 0.15, rad);
}

// 8. ガラスの破片：色ガラスのかけらが重なって転がる
vec3 k8Shards(vec2 p) {
  vec2 q = kfold(p, uJ.x);
  vec3 col = vec3(1.0);
  float seam = 1.0;
  for (int l = 0; l < 2; l++) {
    float fl = float(l);
    vec2 z = rot2(q, uTime * (0.04 + 0.03 * fl) + fl * 1.3) * (3.0 + fl * 1.7) + vec2(uTime * 0.2 * (1.0 + fl), fl * 3.0);
    vec2 s = vec2(z.x - z.y * 0.57735, z.y * 1.1547);
    vec2 id = floor(s);
    vec2 f = fract(s);
    float up = step(1.0, f.x + f.y);
    vec2 h = hash2(id * 2.0 + up + fl * 31.0);
    float e = up > 0.5 ? min(1.0 - f.x, min(1.0 - f.y, f.x + f.y - 1.0)) : min(f.x, min(f.y, 1.0 - f.x - f.y));
    vec3 glass = h.x < 0.3 ? vec3(1.0) : pal(h.y + uShift + fl * 0.3) * 0.9 + 0.1;
    col *= glass;
    seam = min(seam, smoothstep(0.0, 0.05, e));
  }
  return col * (0.25 + 0.85 * seam) * 1.1;
}

// 9. 花びらの曼荼羅：幾重もの花びらが呼吸する
vec3 k9Mandala(vec2 p) {
  float r = length(p);
  float a = atan(p.y, p.x) + uTime * 0.05;
  vec3 col = vec3(0.01, 0.01, 0.03);
  for (int i = 0; i < 8; i++) {
    float fi = float(i);
    float petals = uJ.x * (1.0 + floor(fi * 0.5));
    float base = 0.1 + fi * 0.12 + 0.02 * sin(uTime * 0.4 + fi);
    float edge = base + 0.07 * pow(abs(cos(a * petals * 0.5 + fi * 0.7 + uTime * 0.1 * (mod(fi, 2.0) * 2.0 - 1.0))), 0.6);
    float inside = 1.0 - smoothstep(edge - 0.004, edge + 0.004, r);
    float band = inside * smoothstep(base - 0.13, base - 0.02, r);
    vec3 c = pal(fi * 0.09 + uShift + r * 0.3) * (0.5 + 0.5 * (r - base + 0.13) / 0.2);
    col = mix(col, c, band);
    col += pal(fi * 0.09 + uShift + 0.5) * 0.0015 / (abs(r - edge) + 0.0015);
  }
  return col;
}

vec3 kaleido(vec2 p) {
  float v = uVar;
  vec3 c;
  if (v < 0.5) c = k0Lace(p);
  else if (v < 1.5) c = k1Gems(p);
  else if (v < 2.5) c = k2Stars(p);
  else if (v < 7.5) c = k3Tunnel(p, v - 3.0);
  else if (v < 8.5) c = k4Hyper(p);
  else if (v < 9.5) c = k5Apollo(p);
  else if (v < 14.5) c = k6Liquid(p, v - 10.0);
  else if (v < 15.5) c = k7Threads(p);
  else if (v < 16.5) c = k8Shards(p);
  else c = k9Mandala(p);
  return c * uJ.y;
}

// ═══════ 自然の光と立体の模様（万華鏡の部品 kfold・rot2・hash2・fbm・jewel を使う） ═══════

// ── 水の底でゆらめく光：水面で曲がった光が、底に網目の模様を作る ──
float causticLayer(vec2 p, float t) {
  p += 0.35 * vec2(sin(p.y * 1.3 + t * 0.7), cos(p.x * 1.1 - t * 0.6));
  vec2 g = floor(p);
  vec2 f = fract(p);
  float d1 = 9.0;
  float d2 = 9.0;
  for (int j = -1; j <= 1; j++) {
    for (int i = -1; i <= 1; i++) {
      vec2 o = vec2(float(i), float(j));
      vec2 h = hash2(g + o);
      vec2 r = o + 0.5 + 0.4 * sin(t * 0.8 + 6.2831 * h) - f;
      float d = dot(r, r);
      if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) { d2 = d; }
    }
  }
  return sqrt(d2) - sqrt(d1);
}

vec3 water(vec2 p) {
  float t = uTime * 0.6;
  vec2 q = p * 2.6;
  float e1 = causticLayer(q, t);
  float e2 = causticLayer(q * 1.37 + vec2(3.1, 7.7), -t * 0.83);
  float light = exp(-e1 * 9.0) * 0.8 + exp(-e2 * 11.0) * 0.6 + exp(-min(e1, e2) * 30.0) * 0.8;
  float depth = 0.5 + 0.5 * p.y;
  vec3 deep = mix(vec3(0.0, 0.12, 0.28), vec3(0.0, 0.35, 0.42), depth);
  vec3 col = deep + vec3(0.45, 0.95, 0.9) * light * (0.55 + 0.45 * depth);
  // 斜めに差し込む光の筋
  float ray = 0.0;
  for (int i = 0; i < 4; i++) {
    float fi = float(i);
    ray += pow(0.5 + 0.5 * sin((p.x + p.y * 0.35) * (3.0 + fi * 1.7) + uTime * (0.2 + 0.07 * fi) + fi * 2.0), 8.0);
  }
  col += vec3(0.3, 0.6, 0.6) * ray * 0.12 * (0.3 + depth);
  // 漂う小さな粒
  vec2 z = p * 6.0 + vec2(0.0, uTime * 0.15);
  vec2 h = hash2(floor(z));
  float dot_ = length(fract(z) - 0.5 - (h - 0.5) * 0.6);
  col += vec3(0.6, 1.0, 0.95) * exp(-dot_ * dot_ * 900.0) * step(0.75, h.x) * 0.8;
  return col;
}

// ── 星雲の中を飛ぶ：色とりどりのガスの層が、手前へ流れ去っていく ──
vec3 nebula(vec2 p) {
  vec3 col = vec3(0.0, 0.0, 0.015);
  for (int i = 0; i < 5; i++) {
    float fi = float(i);
    float ph = fi * 0.2 + uTime * 0.035;
    float z = fract(ph);
    float cyc = floor(ph);
    float fade = smoothstep(0.0, 0.3, z) * (1.0 - smoothstep(0.75, 1.0, z));
    float sc = mix(3.5, 0.35, z);
    vec2 q = rot2(p, fi * 1.7 + cyc * 2.3) * sc + vec2(fi * 7.3 + cyc * 3.1, cyc * 5.7);
    float n = fbm(q + 1.6 * vec2(fbm(q * 0.6 + fi), fbm(q * 0.6 - fi)));
    float hsel = hash(fi * 3.7 + cyc * 11.3);
    vec3 c = hsel < 0.25 ? vec3(0.15, 0.4, 1.0) : (hsel < 0.5 ? vec3(0.1, 0.9, 0.6) : (hsel < 0.75 ? vec3(0.75, 0.25, 0.95) : vec3(1.0, 0.45, 0.35)));
    col += c * pow(n, 3.0) * 2.2 * fade;
  }
  // 手前へ飛んでくる星
  for (int l = 0; l < 3; l++) {
    float fl = float(l);
    float z = fract(fl / 3.0 + uTime * 0.08);
    vec2 q = p * mix(10.0, 1.2, z) + fl * 17.0;
    vec2 h = hash2(floor(q) + fl * 5.0);
    float d = length(fract(q) - 0.5 - (h - 0.5) * 0.7);
    float a = smoothstep(0.0, 0.2, z) * (1.0 - smoothstep(0.85, 1.0, z));
    col += vec3(0.85, 0.92, 1.0) * (exp(-d * d * 400.0) * 1.5 + 0.004 / (d + 0.01)) * a * step(0.55, h.x);
  }
  return col;
}

// ── 雪の結晶が育つ：6方向に伸びる枝から、さらに枝が育つ（約24秒ごとに新しい結晶） ──
float segDist(vec2 p, vec2 a, vec2 b) {
  vec2 pa = p - a;
  vec2 ba = b - a;
  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h);
}

vec3 snowflake(vec2 p) {
  p /= min(1.0, uRes.x / uRes.y);   // 縦長の画面でも結晶が横幅に収まるように
  float period = 24.0;
  float cyc = floor(uTime / period);
  float age = uTime / period - cyc;
  float R = 0.92 * smoothstep(0.0, 0.8, age);
  float fadeOut = 1.0 - smoothstep(0.9, 1.0, age);
  float seed = cyc * 7.31;
  vec2 q = kfold(rot2(p, cyc * 0.4), 6.0);  // 12枚の鏡で6回対称
  float d = abs(q.y) + max(q.x - R, 0.0);          // 中心から伸びる主軸
  float hexR = 0.08 + 0.05 * hash(seed);
  d = min(d, max(q.x * 0.866 + q.y * 0.5, q.x) - hexR);  // 中心の六角板
  for (int k = 1; k <= 9; k++) {
    float fk = float(k);
    float x0 = fk * (0.075 + 0.025 * hash(seed + 1.0));
    float grow = max(R - x0, 0.0);
    float len = min(grow * (0.45 + 0.35 * hash(seed + fk * 3.1)), 0.32 * (1.0 - fk / 11.0));
    vec2 a = vec2(x0, 0.0);
    if (len < 0.002) continue;   // まだ伸びていない枝は描かない
    vec2 b = a + len * vec2(0.5, 0.866);
    d = min(d, segDist(q, a, b));
    // 枝の枝
    for (int m = 1; m <= 2; m++) {
      float fm = float(m);
      vec2 c = a + (b - a) * (0.35 * fm);
      float l2 = len * (0.55 - 0.18 * fm) * (0.6 + 0.6 * hash(seed + fk + fm * 9.0));
      if (l2 > 0.002) d = min(d, segDist(q, c, c + l2 * vec2(1.0, 0.0)));
    }
  }
  float w = 0.006 + 0.004 * hash(seed + 5.0);
  float ice = 1.0 - smoothstep(w, w + 0.006, d);
  float glow = exp(-d * 35.0);
  vec3 bg = mix(vec3(0.01, 0.03, 0.12), vec3(0.02, 0.1, 0.25), 0.5 + 0.5 * p.y);
  vec3 col = bg + vec3(0.35, 0.65, 1.0) * glow * 0.5 * fadeOut;
  vec3 iceCol = mix(vec3(0.75, 0.9, 1.0), vec3(1.0), 0.5 + 0.5 * sin(d * 300.0 + uTime));
  col = mix(col, iceCol, ice * fadeOut);
  float spark = pow(max(0.0, sin(q.x * 40.0 - uTime * 3.0)), 30.0) * ice;
  return col + vec3(1.0) * spark * fadeOut;
}

// ── シャボン玉：薄い膜に光が干渉して虹色が流れる ──
vec4 bubble(vec2 p, vec2 c, float R, float seed) {
  vec2 q = (p - c) / R;
  float r2 = dot(q, q);
  if (r2 > 1.0) return vec4(0.0);
  float zz = sqrt(1.0 - r2);
  vec2 w = rot2(q, uTime * 0.07 + seed) * 1.8;
  float th = fbm(w * 1.3 + 1.8 * vec2(fbm(w + uTime * 0.06 + seed), fbm(w * 1.2 - uTime * 0.05)))
           + (q.y + 1.0) * 0.35;
  vec3 film = 0.5 + 0.5 * cos(6.2831853 * (th * 2.6 + vec3(0.0, 0.33, 0.67)));
  float fres = pow(1.0 - zz, 1.6);
  vec3 col = film * (0.32 + 0.8 * fres);
  float spec = pow(max(0.0, dot(normalize(vec3(q, zz)), normalize(vec3(-0.5, 0.6, 0.6)))), 60.0);
  col += vec3(1.0) * spec * 0.9;
  float edge = smoothstep(0.92, 1.0, sqrt(r2));
  return vec4(col + film * edge * 0.5, 0.25 + 0.6 * fres);
}

vec3 soap(vec2 p) {
  p /= min(1.0, uRes.x / uRes.y);   // 縦長の画面でも大きな泡が横幅に収まるように
  vec3 col = mix(vec3(0.0, 0.01, 0.04), vec3(0.02, 0.04, 0.1), 0.5 + 0.5 * p.y);
  for (int i = 0; i < 4; i++) {
    float fi = float(i);
    float R = i == 0 ? 0.62 : 0.14 + 0.1 * hash(fi * 3.3);
    vec2 c = i == 0 ? vec2(0.03 * sin(uTime * 0.2), 0.04 * cos(uTime * 0.17))
                    : vec2(0.75 * sin(uTime * 0.05 * (1.0 + fi) + fi * 2.1), mod(uTime * 0.04 * (1.0 + 0.3 * fi) + fi * 0.7, 2.6) - 1.3);
    vec4 b = bubble(p, c, R, fi * 4.1);
    col = col * (1.0 - b.a * 0.35) + b.rgb * b.a;
  }
  return col;
}

// ── 宝石の城：立体フラクタル（メンガーのスポンジ）の間を飛ぶ ──
float boxDist(vec3 p, vec3 b) {
  vec3 q = abs(p) - b;
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
}

float sponge(vec3 p) {
  float d = boxDist(p, vec3(1.0));
  float s = 1.0;
  for (int m = 0; m < 4; m++) {
    vec3 a = mod(p * s, 2.0) - 1.0;
    s *= 3.0;
    vec3 r = abs(1.0 - 3.0 * abs(a));
    float c = (min(max(r.x, r.y), min(max(r.y, r.z), max(r.z, r.x))) - 1.0) / s;
    d = max(d, c);
  }
  return d;
}

float cityDE(vec3 p) {
  vec3 q = mod(p + 1.0, 2.0) - 1.0;     // 2ごとに並べる
  return sponge(q / 0.62) * 0.62;
}

vec3 crystal(vec2 p) {
  float t = uTime * 0.5;
  vec3 ro = vec3(1.0 + 0.18 * sin(t * 0.37), 1.0 + 0.18 * cos(t * 0.29), t);
  vec3 rd = normalize(vec3(p, 1.5));
  rd.xy = rot2(rd.xy, t * 0.1);
  rd.xz = rot2(rd.xz, 0.25 * sin(t * 0.21));
  rd.yz = rot2(rd.yz, 0.2 * sin(t * 0.17));
  float dist = 0.0;
  float steps = 0.0;
  bool hit = false;
  for (int i = 0; i < 90; i++) {
    float d = cityDE(ro + rd * dist);
    if (d < 0.0012 * dist) { hit = true; break; }
    dist += d * 0.9;
    steps += 1.0;
    if (dist > 14.0) break;
  }
  vec3 fogCol = vec3(0.01, 0.03, 0.09);
  vec3 col = fogCol;
  if (hit) {
    vec3 pos = ro + rd * dist;
    vec2 e = vec2(0.0015, 0.0);
    vec3 n = normalize(vec3(cityDE(pos + e.xyy) - cityDE(pos - e.xyy),
                            cityDE(pos + e.yxy) - cityDE(pos - e.yxy),
                            cityDE(pos + e.yyx) - cityDE(pos - e.yyx)));
    vec3 cell = floor((pos + 1.0) / 2.0);
    vec3 base = jewel(hash(dot(cell, vec3(1.7, 3.1, 5.3))) + uShift * 0.2);
    vec3 L = normalize(vec3(0.4, 0.7, -0.5));
    float dif = max(dot(n, L), 0.0);
    float spec = pow(max(dot(reflect(rd, n), L), 0.0), 40.0);
    float ao = 1.0 - steps / 90.0;
    col = base * (0.15 + 0.85 * dif) * ao * 1.4 + vec3(0.9, 1.0, 1.0) * spec * 0.8;
    col += base * pow(1.0 - abs(dot(n, rd)), 3.0) * 0.6;
    col = mix(fogCol, col, exp(-dist * 0.18));
  }
  col += vec3(0.1, 0.35, 0.6) * (steps / 90.0) * 0.35;  // 縁のほのかな光
  return col;
}

vec3 shade(vec2 p) {
  if (uMode < 0.5) return mandel(p * uScale);
  vec2 pos = uCenter + p * uScale;
  if (uMode < 1.5) return julia(pos);
  if (uMode < 2.5) return newton(pos);
  if (uMode < 3.5) return waves(pos);
  if (uMode < 4.5) return voronoi(pos);
  if (uMode < 5.5) return kaleido(pos);
  if (uMode < 6.5) return water(pos);
  if (uMode < 7.5) return nebula(pos);
  if (uMode < 8.5) return snowflake(pos);
  if (uMode < 9.5) return soap(pos);
  return crystal(pos);
}

void main() {
  float cs = cos(uRot), sn = sin(uRot);
  vec3 acc = vec3(0.0);
  for (int sy = 0; sy < uAA; sy++) {
    for (int sx = 0; sx < uAA; sx++) {
      vec2 fc = gl_FragCoord.xy - 0.5 + (vec2(float(sx), float(sy)) + 0.5) / float(uAA);
      vec2 p = (fc - 0.5*uRes) / uRes.y * 2.0;
      p = vec2(cs*p.x - sn*p.y, sn*p.x + cs*p.y);
      acc += clamp(shade(p), 0.0, 1.0);
    }
  }
  outColor = vec4(pow(acc / float(uAA*uAA), vec3(0.95)), 1.0);
}`;

function pixelBase(height) {
  const o = { pw:0, ph:0, off:document.createElement('canvas'), img:null,
    need(W,H){ const want=Math.max(60,Math.round(height*W/H)); return W>0 && (o.pw===0 || Math.abs(o.pw-want)>2); },
    alloc(W,H){ o.ph=height; o.pw=Math.max(60,Math.round(height*W/H)); o.off.width=o.pw; o.off.height=o.ph;
      o.img=o.off.getContext('2d').createImageData(o.pw,o.ph); },
    flush(){ o.off.getContext('2d').putImageData(o.img,0,0); },
    paint(c,W,H){ c.fillStyle=BG; c.fillRect(0,0,W,H); if(o.pw){ c.imageSmoothingEnabled=true; c.drawImage(o.off,0,0,W,H); } },
  };
  return o;
}

const rd = (() => {
  const B = pixelBase(220); let a,b,na,nb,drop=0,f=0.0367,k=0.0649;
  function seed(){ const cx=Math.random()*B.pw|0, cy=Math.random()*B.ph|0, w=B.pw, h=B.ph;
    for(let y=-3;y<=3;y++) for(let x=-3;x<=3;x++){ const i=((cy+y+h)%h)*w+(cx+x+w)%w; b[i]=1; a[i]=0.5; } }
  function init(W,H){ B.alloc(W,H); const n=B.pw*B.ph; a=new Float32Array(n).fill(1); b=new Float32Array(n);
    na=new Float32Array(n); nb=new Float32Array(n); for(let i=0;i<18;i++) seed(); }
  function step(){ const w=B.pw, h=B.ph;
    for(let y=0;y<h;y++){ const ym=((y-1+h)%h)*w, y0=y*w, yp=((y+1)%h)*w;
      for(let x=0;x<w;x++){ const xm=(x-1+w)%w, xp=(x+1)%w, i=y0+x, av=a[i], bv=b[i];
        const la=0.2*(a[y0+xm]+a[y0+xp]+a[ym+x]+a[yp+x])+0.05*(a[ym+xm]+a[ym+xp]+a[yp+xm]+a[yp+xp])-av;
        const lb=0.2*(b[y0+xm]+b[y0+xp]+b[ym+x]+b[yp+x])+0.05*(b[ym+xm]+b[ym+xp]+b[yp+xm]+b[yp+xp])-bv;
        const abb=av*bv*bv; na[i]=av+la-abb+f*(1-av); nb[i]=bv+0.5*lb+abb-(k+f)*bv; } }
    [a,na]=[na,a]; [b,nb]=[nb,b]; }
  return {
    reset(){ B.pw=0; },
    update(dt,t,P,shift,W,H){
      if (B.need(W,H)) init(W,H); if (!B.pw) return;
      const m=0.5+0.5*Math.sin(t*0.03); f=0.0367+(0.0545-0.0367)*m; k=0.0649+(0.062-0.0649)*m;
      const steps=Math.min(24, Math.round(dt*60*6)); for(let s=0;s<steps;s++) step();
      drop+=dt; if(drop>4){ drop=0; seed(); }
      const L=lut(P,shift,0.75), px=B.img.data, n=B.pw*B.ph;
      for(let i=0;i<n;i++){ let v=b[i]*2.8; v=v<0?0:(v>1?1:v); const li=(v*255|0)*3, q=i*4;
        px[q]=8+L[li]*v*0.96; px[q+1]=8+L[li+1]*v*0.96; px[q+2]=12+L[li+2]*v*0.95; px[q+3]=255; }
      B.flush();
    },
    paint(c,W,H){ B.paint(c,W,H); },
    detail(){ return '2つの物質が広がりながら反応する'; },
  };
})();

const attractor = (() => {
  const B = pixelBase(640); let d, x=0.1, y=0.1, pa=0,pb=0,pc=0,pd=0;
  return {
    reset(){ B.pw=0; },
    update(dt,t,P,shift,W,H){
      if (B.need(W,H)){ B.alloc(W,H); d=new Float32Array(B.pw*B.ph); } if(!B.pw) return;
      pa=-1.4+0.25*Math.sin(t*0.07); pb=1.6+0.2*Math.cos(t*0.05); pc=1.0+0.2*Math.sin(t*0.09); pd=0.7+0.15*Math.cos(t*0.06);
      const pw=B.pw, ph=B.ph;
      if (dt>0){ const dec=Math.exp(-dt*1.5); for(let i=0;i<d.length;i++) d[i]*=dec; }
      const limX=1+Math.abs(pc), limY=1+Math.abs(pd), swap=ph>pw;
      const sc = swap ? Math.min(pw/(2*limY), ph/(2*limX))*1.1 : Math.min(pw/(2*limX), ph/(2*limY))*1.1;
      const cx=pw/2, cy=ph/2, n=Math.min(80000, Math.round(dt*60*40000));
      for(let i=0;i<n;i++){ const nx=Math.sin(pa*y)+pc*Math.cos(pa*x), ny=Math.sin(pb*x)+pd*Math.cos(pb*y); x=nx; y=ny;
        const ix=(swap?cx+y*sc:cx+x*sc)|0, iy=(swap?cy+x*sc:cy+y*sc)|0;
        if(ix>=0&&ix<pw&&iy>=0&&iy<ph) d[iy*pw+ix]+=1; }
      const L=lut(P,shift+0.4,0.8), px=B.img.data;
      for(let i=0;i<d.length;i++){ const dv=d[i], v=dv/(dv+10), li=(v*255|0)*3, q=i*4;
        px[q]=5+L[li]*v*0.97; px[q+1]=5+L[li+1]*v*0.97; px[q+2]=8+L[li+2]*v*0.96; px[q+3]=255; }

    },
    paint(c,W,H){ B.paint(c,W,H); },
    detail(){ return `a=${pa.toFixed(2)} b=${pb.toFixed(2)} c=${pc.toFixed(2)} d=${pd.toFixed(2)}`; },
  };
})();

const penrose = (() => {
  let pos=null, type, dist;
  function build(){
    const phi=(1+Math.sqrt(5))/2; let tris=[];
    for(let i=0;i<10;i++){ let bx=Math.cos((2*i-1)*Math.PI/10), by=Math.sin((2*i-1)*Math.PI/10),
      cx=Math.cos((2*i+1)*Math.PI/10), cy=Math.sin((2*i+1)*Math.PI/10);
      if(i%2===0){ [bx,cx]=[cx,bx]; [by,cy]=[cy,by]; } tris.push([0,0,0,bx,by,cx,cy]); }
    for(let lv=0;lv<8;lv++){ const nx=[];
      for(const t of tris){ const [c,ax,ay,bx,by,cx,cy]=t;
        if(c===0){ const px=ax+(bx-ax)/phi, py=ay+(by-ay)/phi; nx.push([0,cx,cy,px,py,bx,by],[1,px,py,cx,cy,ax,ay]); }
        else { const qx=bx+(ax-bx)/phi, qy=by+(ay-by)/phi, rx=bx+(cx-bx)/phi, ry=by+(cy-by)/phi;
          nx.push([1,rx,ry,cx,cy,ax,ay],[1,qx,qy,rx,ry,bx,by],[0,rx,ry,qx,qy,ax,ay]); } }
      tris=nx; }
    const n=tris.length; pos=new Float32Array(n*6); type=new Uint8Array(n); dist=new Float32Array(n);
    tris.forEach((t,i)=>{ for(let j=0;j<6;j++) pos[i*6+j]=t[j+1]; type[i]=t[0];
      dist[i]=Math.hypot((t[1]+t[3]+t[5])/3,(t[2]+t[4]+t[6])/3); });
  }
  return {
    reset(){}, update(){},
    paint(c,W,H,P,shift,t){
      c.fillStyle=BG; c.fillRect(0,0,W,H);
      if(!pos) build();
      const R=0.36+0.12*Math.sin(t*0.05), s=Math.hypot(W,H)/2/R, NB=48;
      const paths=Array.from({length:NB},()=>new Path2D()), used=new Uint8Array(NB), edges=new Path2D();
      for(let i=0;i<type.length;i++){ if(dist[i]>R+0.04) continue;
        const tv=(type[i]===0?0:0.38)+0.22*Math.sin(dist[i]*14-t*0.5);
        const b=Math.max(0,Math.min(NB-1,Math.floor((tv+0.25)/0.9*NB))), p=paths[b], o=i*6; used[b]=1;
        p.moveTo(pos[o],pos[o+1]); p.lineTo(pos[o+2],pos[o+3]); p.lineTo(pos[o+4],pos[o+5]); p.closePath();
        edges.moveTo(pos[o+4],pos[o+5]); edges.lineTo(pos[o],pos[o+1]); edges.lineTo(pos[o+2],pos[o+3]); }
      c.save(); c.translate(W/2,H/2); c.rotate(t*0.02); c.scale(s,s);
      c.lineWidth=0.8/s; c.lineJoin='round';
      for(let b=0;b<NB;b++){ if(!used[b]) continue; const col=css(P,(b+0.5)/NB*0.9-0.25+shift,0.92);
        c.fillStyle=col; c.strokeStyle=col; c.fill(paths[b]); c.stroke(paths[b]); }
      c.strokeStyle='rgba(5,5,8,0.9)'; c.lineWidth=1.6/s; c.stroke(edges);
      c.restore();
    },
    detail(){ return '2種類のひし形だけで、同じ並びを繰り返さずに敷き詰める'; },
  };
})();

const lsys = (() => {
  const DEFS = [
    {name:'シダのような草', ax:'X', r:{X:'F+[[X]-X]-F[-X]+X', F:'FF'}, ang:25, it:6, sway:true, w:1.0},
    {name:'枝分かれする樹', ax:'F', r:{F:'FF+[+F-F-F]-[-F+F+F]'}, ang:22.5, it:4, sway:true, w:1.3},
    {name:'ドラゴン曲線', ax:'FX', r:{X:'X+YF+', Y:'-FX-Y'}, ang:90, it:12, w:1.6},
    {name:'コッホ雪片', ax:'F--F--F', r:{F:'F+F--F+F'}, ang:60, it:4, w:1.6},
  ];
  const CYC=18; let cur=-1, code='', seg=null, dep=null, maxD=1, bb=[0,0,1,1];
  const idx = t => Math.floor(t/CYC)%DEFS.length;
  function run(angDeg, sway, writeDep){
    const a=angDeg*Math.PI/180; let x=0,y=0,dir=-Math.PI/2,d=0,k=0; const st=[];
    for(let i=0;i<code.length;i++){ const ch=code.charCodeAt(i);
      if(ch===70){ const nx=x+Math.cos(dir), ny=y+Math.sin(dir); seg[k*4]=x; seg[k*4+1]=y; seg[k*4+2]=nx; seg[k*4+3]=ny;
        if(writeDep) dep[k]=d; k++; d++; x=nx; y=ny; }
      else if(ch===43) dir+=a; else if(ch===45) dir-=a;
      else if(ch===91){ st.push(x,y,dir,d); dir+=sway; }
      else if(ch===93 && st.length>=4){ d=st.pop(); dir=st.pop(); y=st.pop(); x=st.pop(); } }
  }
  function load(i){ cur=i; const D=DEFS[i]; let s=D.ax;
    for(let n=0;n<D.it;n++){ let o=''; for(const ch of s) o+=(D.r[ch]??ch); s=o; }
    code=s; let cnt=0; for(let j=0;j<s.length;j++) if(s.charCodeAt(j)===70) cnt++;
    seg=new Float32Array(cnt*4); dep=new Float32Array(cnt); run(D.ang,0,true);
    maxD=1; bb=[Infinity,Infinity,-Infinity,-Infinity];
    for(let k=0;k<cnt;k++){ if(dep[k]>maxD) maxD=dep[k];
      for(let e=0;e<2;e++){ const X=seg[k*4+e*2], Y=seg[k*4+e*2+1];
        if(X<bb[0])bb[0]=X; if(Y<bb[1])bb[1]=Y; if(X>bb[2])bb[2]=X; if(Y>bb[3])bb[3]=Y; } } }
  return {
    reset(){ cur=-1; }, update(){},
    paint(c,W,H,P,shift,t){
      c.fillStyle=BG; c.fillRect(0,0,W,H);
      const i=idx(t); if(i!==cur) load(i); const D=DEFS[i];
      const fr=t/CYC-Math.floor(t/CYC), al=Math.min(1,fr*8,(1-fr)*8), grow=smooth(0,0.6,fr);
      if(D.sway) run(D.ang, 0.05*Math.sin(t*0.9), false);
      const bw=Math.max(1e-6,bb[2]-bb[0]), bh=Math.max(1e-6,bb[3]-bb[1]);
      const s = D.sway ? Math.min(W/bw,H/bh)*0.9 : Math.min(W,H)/Math.max(bw,bh)*0.88;
      const NB=40, paths=Array.from({length:NB},()=>new Path2D()), used=new Uint8Array(NB), lim=grow*maxD;
      for(let k=0;k<dep.length;k++){ if(dep[k]>lim) continue; const b=Math.min(NB-1,Math.floor(dep[k]/maxD*NB));
        used[b]=1; paths[b].moveTo(seg[k*4],seg[k*4+1]); paths[b].lineTo(seg[k*4+2],seg[k*4+3]); }
      c.save(); c.translate(W/2,H/2); if(!D.sway) c.rotate(t*0.03); c.scale(s,s);
      c.translate(-(bb[0]+bb[2])/2, -(bb[1]+bb[3])/2); c.lineWidth=D.w/s; c.lineCap='round';
      for(let b=0;b<NB;b++){ if(!used[b]) continue; c.strokeStyle=css(P,b/NB*0.7+shift,1,al); c.stroke(paths[b]); }
      c.restore();
    },
    detail(t){ return DEFS[idx(t)].name; },
  };
})();

const rdGPU = (() => {

precision highp float; precision highp int;
uniform highp sampler2D uS; uniform vec2 uGrid, uView; uniform float uShift; uniform vec3 uA, uB, uC, uD;

    reset() { w = 0; },
    detail() { return `GPUで ${w}×${h} マスを同時に計算`; },
    run(dt, t, P, shift, W, H) {

      gl.uniform1i(L(pStep,'uS'), 0); gl.viewport(0, 0, w, h);

        else gl.uniform3f(L(pStep,'uDrop'), 0, 0, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fb[1-cur]);
        gl.bindTexture(gl.TEXTURE_2D, tex[cur]);

      }
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, glc.width, glc.height);
      gl.useProgram(pShow);
      gl.bindTexture(gl.TEXTURE_2D, tex[cur]);

})();

// ───────── ストレンジアトラクタ：CPUの全コアで分担して点を打つ ─────────
const attractorMT = (() => {
  const SRC = `let x = Math.random()*0.2, y = Math.random()*0.2;
onmessage = e => {
  const m = e.data, n = m.n, out = new Int32Array(n), w = m.w, h = m.h, cx = w/2, cy = h/2;
  const pa = m.pa, pb = m.pb, pc = m.pc, pd = m.pd, sc = m.sc, swap = m.swap;
  for (let i = 0; i < n; i++) {
    const nx = Math.sin(pa*y) + pc*Math.cos(pa*x), ny = Math.sin(pb*x) + pd*Math.cos(pb*y); x = nx; y = ny;
    const ix = (swap ? cx + y*sc : cx + x*sc) | 0, iy = (swap ? cy + x*sc : cy + y*sc) | 0;
    out[i] = (ix >= 0 && ix < w && iy >= 0 && iy < h) ? iy*w + ix : -1;

  const workers = [];
  try {
    const url = URL.createObjectURL(new Blob([SRC], {type:'text/javascript'}));
    const n = Math.max(1, Math.min(16, CORES - 1));
    for (let i=0;i<n;i++) workers.push(new Worker(url));
  } catch(e) { return null; }
  if (!workers.length) return null;
  const off = document.createElement('canvas');
  let pw = 0, ph = 0, d = null, img = null, pending = 0, acc = 0, inbox = [], meanLit = 1;
  let pa=0, pb=0, pc=0, pd=0, rate = 0, rateCount = 0, rateT = 0;
  workers.forEach(wk => wk.onmessage = e => { inbox.push(e.data); pending--; });
  return {
    reset(){ pw = 0; inbox = []; },
    update(dt, t, P, shift, W, H){
      const wantH = Math.round(Math.min(1000, H * Math.min(window.devicePixelRatio||1, 2)));
      const wantW = Math.max(60, Math.round(wantH * W / H));
      if (W > 0 && (pw === 0 || Math.abs(pw - wantW) > 2)) {

        const sc = swap ? Math.min(pw/(2*limY), ph/(2*limX))*1.1 : Math.min(pw/(2*limX), ph/(2*limY))*1.1;
        const n = Math.min(300000, Math.round(acc*60*100000));

        pending = workers.length; acc = 0;
      }
      const dec = Math.exp(-dt*1.5), L = lut(P, shift+0.4, 0.8), px = img.data, K = Math.max(1, meanLit*0.8);
      let sum = 0, cnt = 0;
      for (let i=0;i<d.length;i++){
        const dv = d[i] *= dec;
        if (dv > 0.05) { sum += dv; cnt++; }

      off.getContext('2d').putImageData(img, 0, 0);
    },
    paint(c, W, H){ c.fillStyle=BG; c.fillRect(0,0,W,H); if (pw) { c.imageSmoothingEnabled=true; c.drawImage(off,0,0,W,H); } },
    detail(){ return `a=${pa.toFixed(2)} b=${pb.toFixed(2)} c=${pc.toFixed(2)} d=${pd.toFixed(2)}`; },
    quality(){ const r = rate>=1e6 ? (rate/1e6).toFixed(1)+'百万' : Math.round(rate/1e4)+'万'; return `CPU ${workers.length}コアで計算・毎秒 約${r}点・${pw}×${ph}`; },
  };
})();

// ───────── 4次元の立体：4次元で回して、3次元、さらに画面へと影を落とす ─────────
const poly4 = (() => {
  const PHI = (1 + Math.sqrt(5)) / 2;
  function tesseract() { const v = []; for (let i = 0; i < 16; i++) v.push([i&1?1:-1, i&2?1:-1, i&4?1:-1, i&8?1:-1]); return v; }
  function cell24() { const v = [];
    for (let a = 0; a < 4; a++) for (let b = a+1; b < 4; b++) for (const sa of [-1,1]) for (const sb of [-1,1]) {
      const p = [0,0,0,0]; p[a] = sa; p[b] = sb; v.push(p); }
    return v; }
  function cell600() { const v = [];
    for (let a = 0; a < 4; a++) for (const s of [-1,1]) { const p = [0,0,0,0]; p[a] = s; v.push(p); }
    for (let i = 0; i < 16; i++) v.push([i&1?.5:-.5, i&2?.5:-.5, i&4?.5:-.5, i&8?.5:-.5]);
    const base = [PHI/2, 0.5, 1/(2*PHI), 0];
    const perms = [];
    (function perm(arr, k) { if (k === 4) { perms.push(arr.slice()); return; }
      for (let i = k; i < 4; i++) { [arr[k], arr[i]] = [arr[i], arr[k]]; perm(arr, k+1); [arr[k], arr[i]] = [arr[i], arr[k]]; } })([0,1,2,3], 0);
    const parity = p => { let inv = 0; for (let i = 0; i < 4; i++) for (let j = i+1; j < 4; j++) if (p[i] > p[j]) inv++; return inv % 2; };
    for (const pm of perms) { if (parity(pm)) continue;
      for (let sg = 0; sg < 8; sg++) { const p = [0,0,0,0];
        for (let k = 0; k < 3; k++) p[pm[k]] = base[k] * ((sg >> k) & 1 ? -1 : 1);
        v.push(p); } }
    return v; }
  function build(v) {
    const r = Math.hypot(...v[0]); v = v.map(p => p.map(x => x / r));
    let min = Infinity;
    for (let i = 0; i < v.length; i++) for (let j = i+1; j < v.length; j++) {
      const d = Math.hypot(v[i][0]-v[j][0], v[i][1]-v[j][1], v[i][2]-v[j][2], v[i][3]-v[j][3]); if (d > 1e-6 && d < min) min = d; }
    const e = [];
    for (let i = 0; i < v.length; i++) for (let j = i+1; j < v.length; j++) {
      const d = Math.hypot(v[i][0]-v[j][0], v[i][1]-v[j][1], v[i][2]-v[j][2], v[i][3]-v[j][3]); if (Math.abs(d - min) < 1e-3) e.push(i, j); }
    return { v, e };
  }
  const SHAPES = [
    { name: '超立方体（正八胞体）', ...build(tesseract()) },
    { name: '正二十四胞体', ...build(cell24()) },
    { name: '正六百胞体', ...build(cell600()) },
  ];
  const CYC = 30;
  const idx = t => Math.floor(t / CYC) % SHAPES.length;
  return {
    reset(){}, update(){},
    paint(c, W, H, P, shift, t) {
      c.fillStyle = BG; c.fillRect(0, 0, W, H);
      const S = SHAPES[idx(t)], fr = t / CYC - Math.floor(t / CYC), al = Math.min(1, fr * 6, (1 - fr) * 6);
      const a1 = t * 0.31, a2 = t * 0.23, a3 = t * 0.11, a4 = t * 0.17;
      const n = S.v.length, sx = new Float32Array(n), sy = new Float32Array(n), sw = new Float32Array(n), sz = new Float32Array(n);
      const R = Math.min(W, H) * 2.4;
      for (let i = 0; i < n; i++) {
        let [x, y, z, w] = S.v[i];
        // 4次元の回転（XW・YZ・XY・ZW の4つの面で回す）
        let c1 = Math.cos(a1), s1 = Math.sin(a1); [x, w] = [c1*x - s1*w, s1*x + c1*w];
        let c2 = Math.cos(a2), s2 = Math.sin(a2); [y, z] = [c2*y - s2*z, s2*y + c2*z];
        let c3 = Math.cos(a3), s3 = Math.sin(a3); [x, y] = [c3*x - s3*y, s3*x + c3*y];
        let c4 = Math.cos(a4), s4 = Math.sin(a4); [z, w] = [c4*z - s4*w, s4*z + c4*w];
        const k = 1 / (2.0 - w);                 // 4次元→3次元の遠近
        const X = x*k, Y = y*k, Z = z*k;
        const q = 1 / (3.0 - Z);                 // 3次元→画面の遠近
        sx[i] = W/2 + X*q*R; sy[i] = H/2 + Y*q*R; sw[i] = w; sz[i] = q;
      }
      c.save(); c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
      const NB = 16, paths = Array.from({length: NB}, () => new Path2D()), used = new Uint8Array(NB);
      for (let k = 0; k < S.e.length; k += 2) { const i = S.e[k], j = S.e[k+1];
        const b = Math.max(0, Math.min(NB-1, Math.floor(((sw[i]+sw[j])/2 + 1) / 2 * NB)));
        paths[b].moveTo(sx[i], sy[i]); paths[b].lineTo(sx[j], sy[j]); used[b] = 1; }
      const lw = S.v.length > 50 ? 0.6 : 1.0;
      for (let b = 0; b < NB; b++) { if (!used[b]) continue;
        c.strokeStyle = css(P, b/NB*0.6 + shift, 1, 0.12*al); c.lineWidth = 7*lw; c.stroke(paths[b]);
        c.strokeStyle = css(P, b/NB*0.6 + shift, 1, 0.85*al); c.lineWidth = 1.6*lw; c.stroke(paths[b]); }
      for (let i = 0; i < n; i++) { const r = (S.v.length > 50 ? 1.6 : 3.2) * sz[i] * 2.2;
        c.fillStyle = css(P, (sw[i]+1)/2*0.6 + shift + 0.3, 1, al); c.beginPath(); c.arc(sx[i], sy[i], r, 0, 6.2832); c.fill(); }

    },
    detail(t) { const S = SHAPES[idx(t)]; return `${S.name}・頂点${S.v.length}個・辺${S.e.length/2}本`; },
  };
})();

// ───────── 光の群れ：近くの仲間と「離れすぎず・ぶつからず・同じ向きに」で群れが生まれる ─────────
const flock = (() => {
  const K = 8;   // 光の尾の長さ（何フレーム分の位置を覚えるか）
  let N = 0, W0 = 0, H0 = 0, px, py, vx, vy, hx, hy, head = 0, grid, cellOf, next;
  const CELL = 40;
  function init(W, H) {
    W0 = W; H0 = H; N = Math.round(Math.min(1400, Math.max(500, W * H / 450)));
    px = new Float32Array(N); py = new Float32Array(N); vx = new Float32Array(N); vy = new Float32Array(N);
    hx = new Float32Array(N * K); hy = new Float32Array(N * K);
    for (let i = 0; i < N; i++) { px[i] = Math.random()*W; py[i] = Math.random()*H; const a = Math.random()*6.283; vx[i] = Math.cos(a)*80; vy[i] = Math.sin(a)*80;
      for (let k = 0; k < K; k++) { hx[i*K+k] = px[i]; hy[i*K+k] = py[i]; } }
    next = new Int32Array(N);
  }
  return {
    reset(){ N = 0; },
    update(dt, t, P, shift, W, H) {
      if (W <= 0) return;
      if (N === 0 || Math.abs(W - W0) > 2 || Math.abs(H - H0) > 2) init(W, H);
      if (dt <= 0) return;
      const gw = Math.ceil(W / CELL) + 1, gh = Math.ceil(H / CELL) + 1;
      if (!grid || grid.length !== gw * gh) grid = new Int32Array(gw * gh);
      grid.fill(-1);
      for (let i = 0; i < N; i++) { const g = Math.min(gh-1, Math.max(0, py[i]/CELL|0)) * gw + Math.min(gw-1, Math.max(0, px[i]/CELL|0)); next[i] = grid[g]; grid[g] = i; }
      // 群れが目指す点（ゆっくり8の字を描く）
      const tx = W/2 + W*0.3*Math.sin(t*0.23), ty = H/2 + H*0.28*Math.sin(t*0.37);
      const h = Math.min(dt, 0.05);
      for (let i = 0; i < N; i++) {
        let ax = 0, ay = 0, cx = 0, cy = 0, sx = 0, sy = 0, cnt = 0;
        const gx = px[i]/CELL|0, gy = py[i]/CELL|0;
        for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
          const X = gx+ox, Y = gy+oy; if (X < 0 || Y < 0 || X >= gw || Y >= gh) continue;
          for (let j = grid[Y*gw+X]; j >= 0; j = next[j]) { if (j === i) continue;
            const dx = px[j]-px[i], dy = py[j]-py[i], d2 = dx*dx + dy*dy; if (d2 > CELL*CELL) continue;
            ax += vx[j]; ay += vy[j]; cx += dx; cy += dy; cnt++;
            if (d2 < 400) { sx -= dx / (d2 + 1); sy -= dy / (d2 + 1); } } }
        let fx = 0, fy = 0;
        if (cnt) { fx += (ax/cnt - vx[i]) * 2.5 + cx/cnt * 1.5; fy += (ay/cnt - vy[i]) * 2.5 + cy/cnt * 1.5; }
        fx += sx * 900; fy += sy * 900;
        fx += (tx - px[i]) * 0.22; fy += (ty - py[i]) * 0.22;
        const m = 40; if (px[i] < m) fx += (m - px[i]) * 6; if (px[i] > W-m) fx -= (px[i] - W + m) * 6;
        if (py[i] < m) fy += (m - py[i]) * 6; if (py[i] > H-m) fy -= (py[i] - H + m) * 6;
        vx[i] += fx * h; vy[i] += fy * h;
        const sp = Math.hypot(vx[i], vy[i]), lim = Math.min(170, Math.max(60, sp));
        if (sp > 0) { vx[i] *= lim/sp; vy[i] *= lim/sp; }
      }
      head = (head + 1) % K;
      for (let i = 0; i < N; i++) { px[i] += vx[i]*h; py[i] += vy[i]*h; hx[i*K+head] = px[i]; hy[i*K+head] = py[i]; }
    },
    paint(c, W, H, P, shift, t) {
      c.fillStyle = BG; c.fillRect(0, 0, W, H);
      if (!N) return;
      c.save(); c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
      const NB = 20;
      for (let age = K - 2; age >= 0; age--) {
        const paths = Array.from({length: NB}, () => new Path2D()), used = new Uint8Array(NB);
        const k0 = (head - age + K) % K, k1 = (head - age - 1 + K) % K;
        for (let i = 0; i < N; i++) {
          const b = Math.floor(((Math.atan2(vy[i], vx[i]) / 6.2832) + 1) % 1 * NB);
          paths[b].moveTo(hx[i*K+k1], hy[i*K+k1]); paths[b].lineTo(hx[i*K+k0], hy[i*K+k0]); used[b] = 1; }
        const a = (1 - age / (K - 1)) * 0.8;
        c.lineWidth = age === 0 ? 2.4 : 1.6;
        for (let b = 0; b < NB; b++) { if (!used[b]) continue; c.strokeStyle = css(P, b/NB + shift, 1, a); c.stroke(paths[b]); }
      }
      c.restore();
    },
    detail() { return `${N}個の光の粒が、近くの仲間だけを見て動く`; },
  };
})();

const CPU = {3:phyllo, 4:rd, 5:(attractorMT || attractor), 6:rose, 8:penrose, 9:lsys, 17:poly4, 18:flock};
const useRdGPU = () => rdGPU && rdGPU.ok;

// ───────── 状態 ─────────
const S = { pattern:0, pending:-1, fade:0, autoCycle:false, cycle:0, ptime:0,

newSeg(true);
function stepTour(dt){ const g=S.seg; g.t+=dt; const p=Math.min(1,g.t/g.dur);
  S.logS=lerp(g.s0,g.s1,smooth(0,1,p));
  const f = g.zoomIn ? smooth(0,0.15,p) : smooth(0.55,1,p);
  S.cx=lerp(g.c0[0],g.c1[0],f); S.cy=lerp(g.c0[1],g.c1[1],f);
  if(p>=1){ if(g.zoomIn){ S.tIdx=(S.tIdx+1)%TARGETS.length; newSeg(false); } else newSeg(true); } }
function curPal(){ const P=PALETTES[S.palIdx], k=smooth(0,1,S.palT), m=key=>[0,1,2].map(i=>lerp(S.palFrom[key][i],P[key][i],k));
  return {a:m('a'), b:m('b'), c:m('c'), d:m('d')}; }
// 万華鏡 18種類：30秒ごとに次の種類へ。替わる前後は暗くする（「ずっと見る」の間は替えない）
const K_NAMES=['宝石のレース','エメラルドとサファイア','星屑','無限トンネル','無限トンネル：らせん','無限トンネル：宝石の回廊','無限トンネル：光の輪','無限トンネル：二つの渦','双曲の鏡','アポロニウスのレース','流れるガラス','流れるガラス：夕焼け','流れるガラス：オーロラ','流れるガラス：大理石','流れるガラス：オパール','光の糸','ガラスの破片','花びらの曼荼羅'];
const K_DESCS=['折り返しと反転を繰り返して生まれるレース','緑と青の宝石を金の枠に散りばめる','青と緑のきらめきが流れていく','どこまでも奥へ続く鏡のトンネル','渦を巻きながら奥へ吸い込まれる','緑と青の宝石が奥へと連なる','ネオンのような光の線が奥へ続く','一方の渦から湧き出て、もう一方へ吸い込まれる','縁へ向かって無限に細かくなる敷き詰め','円の中に円が無限に詰まったレース','溶けたガラスのように宝石の色が流れる','紫からバラ色、金色へと流れる','緑と紫の光のカーテンが揺れる','白い石の中を青と金の筋が流れる','虹色の光がきらめきながら流れる','光る糸が鏡の間を行き交う','色ガラスのかけらが重なって転がる','幾重もの花びらが呼吸する'];
const K_SEGS=[8,6,8,8,6,8,10,6,7,6,6,8,6,6,8,12,6,8];
const kVar = () => (S.kStart + Math.floor(S.kTime/30)) % K_NAMES.length;
const kSegs = () => K_SEGS[kVar()];
const kDim = () => { const fadeIn=Math.min(1,S.ptime/5); if(S.kHold) return fadeIn;
  const fr=S.kTime/30-Math.floor(S.kTime/30); return Math.min(fadeIn, Math.min(1, Math.min(fr*6,(1-fr)*6)+(S.kTime<5?1:0))); };
function requestKaleido(v){ S.kNext=v; S.pending=11; }
const usesGL = i => PATTERNS[i].sm >= 0 || (i === 4 && useRdGPU());
function requestPattern(i){ if(i===S.pattern && S.pending<0) return; S.pending=i; }
function apply(i){ S.pattern=i; S.ptime=0; S.cycle=0; S.auto=true; S.cx=0; S.cy=0; S.logS=0;
  if(i===0){ S.cx=TARGETS[S.tIdx][1]; S.cy=TARGETS[S.tIdx][2]; S.logS=Math.log(WIDE); newSeg(true); }
  if(i===11){ S.kTime=0; if(S.kNext>=0){ S.kStart=S.kNext; S.kNext=-1; } }
  if(CPU[i]) CPU[i].reset();
  if(i===4 && rdGPU) rdGPU.reset();
  glc.style.display = usesGL(i) ? 'block' : 'none';
  cv.style.display = usesGL(i) ? 'none' : 'block';
  updateButtons(); }

// ───────── 画質の自動調整：余裕があれば解像度を上げ、さらに1画素を最大9回計算して平均する ─────────
const maxScale=Math.min(window.devicePixelRatio||1, 2);
let rScale=Math.min(1,maxScale), aa=1, avg=16.7, best=16.7, sinceAdj=0, holdUp=0, W=innerWidth, H=innerHeight;
function resize(){ W=innerWidth; H=innerHeight;
  const gw=Math.max(1,Math.round(W*rScale)), gh=Math.max(1,Math.round(H*rScale));
  if(glc.width!==gw||glc.height!==gh){ glc.width=gw; glc.height=gh; }
  const cw=Math.round(W*maxScale), ch=Math.round(H*maxScale);
  if(cv.width!==cw||cv.height!==ch){ cv.width=cw; cv.height=ch; } }
addEventListener('resize', resize); resize();
function adjustQuality(raw){
  if(raw>0){ avg=avg*0.9+raw*1000*0.1; best=Math.min(best,avg); }
  sinceAdj+=raw; holdUp=Math.max(0,holdUp-raw);
  if(sinceAdj<0.8) return;
  const gpuShader = PATTERNS[S.pattern].sm >= 0;
  if(avg>best*1.45){
    if(aa>1) aa--; else if(rScale>0.3){ rScale=Math.max(0.3,rScale*0.85); resize(); }
    sinceAdj=0; holdUp=6;
  } else if(avg<best*1.12 && holdUp<=0){
    if(rScale<maxScale){ rScale=Math.min(maxScale,rScale*1.1); resize(); sinceAdj=0; }
    else if(gpuShader && aa<3){ aa++; sinceAdj=0; }
  }
}

// ───────── 毎フレーム ─────────
let last=performance.now();
function frame(now){
  const raw=Math.min(0.1,Math.max(0,(now-last)/1000)); last=now;
  adjustQuality(raw);
  if(S.pending>=0){ S.fade=Math.min(1,S.fade+raw/0.6); if(S.fade>=1){ apply(S.pending); S.pending=-1; } }
  else if(S.fade>0) S.fade=Math.max(0,S.fade-raw/0.8);
  $('fade').style.opacity=S.fade;

  const dt=S.playing?raw*S.speed:0;
  S.ptime+=dt; S.rot+=dt*0.025; S.shift+=dt*0.035;
  if(S.pattern===11 && !S.kHold) S.kTime+=dt;
  if(S.autoCycle && S.pending<0 && !(S.pattern===11 && S.kHold)){ S.cycle+=dt; if(S.cycle>(S.pattern===0?75:(S.pattern===11?150:45))) requestPattern((S.pattern+1)%PATTERNS.length); }
  S.palT=Math.min(1,S.palT+raw/1.8);
  const P=curPal(), cpu=CPU[S.pattern];
  if(S.pattern===0){ if(S.auto) stepTour(dt); }
  else if(S.pattern===1){ S.jAngle+=dt*0.06; if(S.auto){ S.logS=Math.log(1.45+0.12*Math.sin(S.jAngle*1.7)); S.cx=0; S.cy=0; } }
  else if(S.pattern===2){ if(S.auto){ S.logS=Math.log(1.35+0.2*Math.sin(S.ptime*0.08)); S.cx=0; S.cy=0; } }
  else { S.cx=0; S.cy=0; S.logS=0; }

  if(S.pattern===4 && useRdGPU()){
    rdGPU.run(dt,S.ptime,P,S.shift,W,H);
  } else if(cpu){
    cpu.update(dt,S.ptime,P,S.shift,W,H);
    ctx.setTransform(maxScale,0,0,maxScale,0,0);
    cpu.paint(ctx,W,H,P,S.shift,S.ptime);
  } else {
    const scale=Math.exp(S.logS), sm=PATTERNS[S.pattern].sm;
    const iter = sm===0 ? Math.round(Math.min(12000,Math.max(250,250+160*Math.log2(WIDE/scale)))) : 320;
    gl.useProgram(prog);
    gl.viewport(0,0,glc.width,glc.height);
    if(sm===0) gl.uniform1i(U.uRefLen, uploadRef(S.cx,S.cy,iter));
    gl.uniform2f(U.uRes,glc.width,glc.height); gl.uniform2f(U.uCenter,S.cx,S.cy);
    if(S.pattern===11) gl.uniform2f(U.uJ,kSegs(),kDim());
    else gl.uniform2f(U.uJ,JR*Math.cos(S.jAngle),JR*Math.sin(S.jAngle));
    gl.uniform1f(U.uScale,scale); gl.uniform1f(U.uRot,S.rot); gl.uniform1f(U.uShift,S.shift);
    gl.uniform1f(U.uIter,iter); gl.uniform1f(U.uMode,sm); gl.uniform1f(U.uTime,S.ptime); gl.uniform1i(U.uAA,aa); gl.uniform1f(U.uVar,kVar());
    gl.uniform3fv(U.uA,P.a); gl.uniform3fv(U.uB,P.b); gl.uniform3fv(U.uC,P.c); gl.uniform3fv(U.uD,P.d);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  updateInfo();
  requestAnimationFrame(frame);
}

// ───────── 表示 ─────────
function fmtZoom(z){
  if(z<10) return z.toFixed(1);
  if(z<1e4) return Math.round(z).toLocaleString();
  const units=[[1e12,'兆'],[1e8,'億'],[1e4,'万']];
  for(const [u,s] of units) if(z>=u){ const v=z/u; return (v<10?v.toFixed(1):Math.round(v).toLocaleString())+s; }
}
function updateInfo(){
  let place=PATTERNS[S.pattern].name, det='', q='';
  const scale=Math.exp(S.logS), sm=PATTERNS[S.pattern].sm;
  if(S.pattern===0){ place = !S.auto ? '自由探索' : (S.seg.zoomIn ? TARGETS[S.tIdx][0] : '→ '+TARGETS[S.tIdx][0]);
    det='倍率 ×'+fmtZoom(WIDE/scale); }
  else if(S.pattern===1){ const re=JR*Math.cos(S.jAngle), im=JR*Math.sin(S.jAngle);
    det=`c = ${re.toFixed(3)} ${im>=0?'+':'−'} ${Math.abs(im).toFixed(3)}i`; }
  else if(S.pattern===2) det='z³ = 1 の3つの解のどれにたどり着くかで色分け';
  else if(S.pattern===7) det='動く40個の種に、いちばん近い場所で塗り分ける';
  else if(S.pattern===10) det='3つの波源の波が強め合い、打ち消し合う';
  else if(S.pattern===11){ place='万華鏡：'+K_NAMES[kVar()]; det=`${K_DESCS[kVar()]}（${kVar()+1}/${K_NAMES.length}）${S.kHold?'・ずっと表示中':''}`; }
  else if(S.pattern===4 && useRdGPU()) det='2つの物質が広がりながら反応する';
  else if(S.pattern>=12 && S.pattern<=16) det=['水面で曲がった光が、底に揺れる網目を描く','色とりどりのガスと星の中を、奥へ奥へと進む','6方向に枝を伸ばして育つ（約24秒ごとに新しい結晶）','薄い膜に光が干渉して、虹色が流れる','メンガーのスポンジが並ぶ街を飛び抜ける'][S.pattern-12];
  else det=CPU[S.pattern].detail(S.ptime);
  if(sm>=0) q=`GPUで描画 ${glc.width}×${glc.height}・1画素を${aa*aa}回計算`;
  else if(S.pattern===4 && useRdGPU()) q=rdGPU.detail();
  else if(CPU[S.pattern].quality) q=CPU[S.pattern].quality();
  $('place').textContent=place; $('detail').textContent=det; $('q').textContent=q;
}

// ───────── ボタンとメニュー ─────────
const ui=document.querySelectorAll('.ui'); let hideTimer, menuOpen=false;
function showUI(){ ui.forEach(e=>e.classList.remove('hidden')); clearTimeout(hideTimer);
  hideTimer=setTimeout(()=>{ if(!menuOpen) ui.forEach(e=>e.classList.add('hidden')); },4000); }
function updateButtons(){
  $('bMenu').textContent = S.autoCycle ? '模様（おまかせ）' : '模様';
  $('bPlay').textContent = !S.auto ? '自動再開' : (S.playing ? '一時停止' : '再生');
  $('bHold').style.display = S.pattern===11 ? '' : 'none';
  $('bHold').textContent = S.kHold ? 'ずっと見る：オン' : 'ずっと見る';
}
function on(el,fn){ el.addEventListener('pointerdown',e=>e.stopPropagation()); el.addEventListener('click',e=>{ e.stopPropagation(); fn(); updateButtons(); showUI(); }); }
function buildMenu(){
  const m=$('menu'); m.innerHTML='';
  const auto=document.createElement('button'); auto.className='row';
  auto.innerHTML='<span>おまかせで次々と切り替える<span class="sub">約45秒ごとに次の模様へ</span></span><span class="sw'+(S.autoCycle?' on':'')+'"></span>';
  on(auto,()=>{ S.autoCycle=!S.autoCycle; S.cycle=0; buildMenu(); });
  m.appendChild(auto); m.appendChild(document.createElement('hr'));
  PATTERNS.forEach((p,i)=>{ const b=document.createElement('button'); b.className='row';
    b.innerHTML='<span></span><span>'+(i===(S.pending>=0?S.pending:S.pattern)?'✓':'')+'</span>'; b.firstChild.textContent=p.name;
    if(i===11) b.firstChild.textContent=`万華鏡（${K_NAMES.length}種類を順番に）`;
    on(b,()=>{ requestPattern(i); closeMenu(); }); m.appendChild(b);
    if(i===11) K_NAMES.forEach((n,v)=>{ const c=document.createElement('button'); c.className='row';
      c.style.cssText='padding:10px 20px 10px 44px;font-size:14px';
      c.innerHTML='<span></span><span>'+(S.pattern===11&&S.pending<0&&kVar()===v?'✓':'')+'</span>'; c.firstChild.textContent='・'+n;
      on(c,()=>{ requestKaleido(v); closeMenu(); }); m.appendChild(c); }); });
}
function openMenu(){ buildMenu(); menuOpen=true; $('menu').classList.add('open'); }
function closeMenu(){ menuOpen=false; $('menu').classList.remove('open'); }
$('menu').addEventListener('pointerdown',e=>e.stopPropagation());
on($('bMenu'), ()=> menuOpen ? closeMenu() : openMenu());
on($('bHold'), ()=>{ S.kHold=!S.kHold; });
on($('bColor'), ()=>{ S.palFrom=curPal(); S.palIdx=(S.palIdx+1)%PALETTES.length; S.palT=0; });
const SPEEDS=[1,2,4,0.5]; let sIdx=0;
on($('bSpeed'), ()=>{ sIdx=(sIdx+1)%SPEEDS.length; S.speed=SPEEDS[sIdx]; $('bSpeed').textContent=`速さ ${S.speed}×`; });
on($('bPlay'), ()=>{ if(!S.auto){ S.auto=true; S.playing=true; if(S.pattern===0) newSeg(false); } else S.playing=!S.playing; });
on($('bFull'), ()=>{ const d=document, el=d.documentElement;
  try { const r=(!d.fullscreenElement&&!d.webkitFullscreenElement)
      ? (el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el)
      : (d.exitFullscreen||d.webkitExitFullscreen||(()=>{})).call(d);
    if(r&&r.catch) r.catch(()=>{}); } catch(e){} });

// ───────── 指・マウスで動かす（フラクタル3種類のみ） ─────────
const ptrs=new Map(); let moved=0, pinch0=null;
function manual(){ if(S.auto){ S.auto=false; updateButtons(); } }
function toComplex(dx,dy){ const s=Math.exp(S.logS)*2/innerHeight, c=Math.cos(S.rot), n=Math.sin(S.rot), x=dx*s, y=-dy*s; return [c*x-n*y, n*x+c*y]; }
function zoomBy(f){ S.logS=Math.min(Math.log(3),Math.max(Math.log(S.pattern===0?DEEPEST:1e-4),S.logS-Math.log(f))); }
addEventListener('pointerdown',e=>{ if(menuOpen){ closeMenu(); return; } ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0;
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch0=Math.hypot(a.x-b.x,a.y-b.y); } });
addEventListener('pointermove',e=>{ if(!ptrs.has(e.pointerId)) return;
  const p=ptrs.get(e.pointerId), dx=e.clientX-p.x, dy=e.clientY-p.y; moved+=Math.abs(dx)+Math.abs(dy);
  if(moved<6) return; showUI(); p.x=e.clientX; p.y=e.clientY;
  if(!PATTERNS[S.pattern].g) return; manual();
  if(ptrs.size===1){ const d=toComplex(dx,dy); S.cx-=d[0]; S.cy-=d[1]; }
  if(ptrs.size===2&&pinch0){ const [a,b]=[...ptrs.values()], d=Math.hypot(a.x-b.x,a.y-b.y); zoomBy(d/pinch0); pinch0=d; } });
const up=e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch0=null; if(moved<6&&ptrs.size===0) showUI(); };
addEventListener('pointerup',up); addEventListener('pointercancel',up);
addEventListener('wheel',e=>{ e.preventDefault(); showUI(); if(!PATTERNS[S.pattern].g) return; manual(); zoomBy(Math.exp(-e.deltaY*0.0015)); },{passive:false});

updateButtons(); showUI(); requestAnimationFrame(frame);
})();
</script>
</body>
