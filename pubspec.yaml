name: mandelbrot_drift
description: スマホのGPUでマンデルブロ集合を描き続けるアプリ
publish_to: 'none'
version: 1.9.0+9

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: any   # スマホの傾き（加速度センサー）
  audioplayers: any   # 環境音を鳴らす

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  shaders:
    - shaders/mandelbrot.frag
